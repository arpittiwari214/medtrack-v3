# Fly.io configuration for the MedTrack API.
#
# Deploy from the REPOSITORY ROOT (the image needs packages/shared), naming
# both files explicitly so the build context is unambiguous:
#
#   fly deploy . --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
#
# See docs/DEPLOY.md for first-time setup and the secrets to set.

# Change to the name you choose with `fly launch`. It becomes
# https://<app>.fly.dev, which the web and mobile builds point at.
app = "medtrack-api"

# Mumbai. Keeps health data in India, close to the people using it — the
# research found no DPDP localisation duty today, but the draft ABDM health
# data policy points this way, and latency from India is far lower.
primary_region = "bom"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # Fly terminates TLS in one proxy hop; this makes rate limiting and logs
  # see the real client address rather than the proxy's.
  TRUST_PROXY_HOPS = "1"

[http_service]
  internal_port = 8080
  force_https = true

  # Never sleep. v3 ran on a free tier that slept when idle, and its
  # in-process reminder scheduler died with it — that is what took it down.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# One machine. The scheduler runs inside the API process, so a second
# machine would send every caregiver alert twice. To scale out, set
# SCHEDULER_ENABLED=false on every machine but one.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
